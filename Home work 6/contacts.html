<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Контакты</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- НАВИГАЦИЯ -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="index.html">Tabyn</a>
        <div class="navbar-nav">
          <a class="nav-link" href="index.html">Главная</a>
          <a class="nav-link" href="about.html">О нас</a>
          <a class="nav-link active" href="contacts.html">Контакты</a>
        </div>
      </div>
    </nav>

    <div class="container my-5">
      <!-- ТАБЛИЦА -->
      <h2>Контактная информация</h2>
      <table class="table table-bordered">
        <tr>
          <th>Email</th>
          <td>tabyn@exam.com</td>
        </tr>
        <tr>
          <th>Телефон</th>
          <td>+7 877 777 77 77</td>
        </tr>
        <tr>
          <th>Адрес</th>
          <td>Шымкент, Казахстан</td>
        </tr>
      </table>

      <!-- КАРТА -->
      <div class="mb-4">
        <iframe
          src="https://maps.google.com/maps?q=Shymkent&t=&z=13&ie=UTF8&iwloc=&output=embed"
          width="100%"
          height="300"
          style="border: 0"
          loading="lazy"
        >
        </iframe>
      </div>

      <!-- ФОРМА -->
      <h3>Форма обратной связи</h3>
      <form>
        <div class="mb-3">
          <input type="text" class="form-control" placeholder="Ваше имя" />
        </div>

        <div class="mb-3">
          <input type="email" class="form-control" placeholder="Email" />
        </div>

        <div class="mb-3">
          <textarea
            class="form-control"
            rows="4"
            placeholder="Сообщение"
          ></textarea>
        </div>

        <button class="btn btn-primary">Отправить</button>
      </form>
    </div>
  </body>
</html>
