<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>DOM Фигуры</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h2>Выбор фигуры и цвета</h2>

    <!-- Панель управления -->
    <div class="controls">
      <button id="circleBtn">Круг</button>
      <button id="squareBtn">Квадрат</button>
      <button id="clearBtn">Очистить</button>
    </div>

    <!-- Кнопки цветов -->
    <div class="colors" id="colorButtons"></div>

    <!-- Область отображения фигуры -->
    <div class="figure-container" id="figureContainer"></div>

    <script src="script.js"></script>
  </body>
</html>
